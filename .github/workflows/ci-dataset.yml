name: CI / dataset

on:
  push:
    paths:
      - "dataset/**"
      - ".github/workflows/ci-dataset.yml"
  pull_request:
    paths:
      - "dataset/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.3"

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dataset package
        working-directory: dataset
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run tests
        working-directory: dataset
        run: uv run pytest tests/ -q

      - name: Lint
        run: uv run --with ruff ruff check dataset/retrieval_dataset/
