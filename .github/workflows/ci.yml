name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile \
            chunk_selector.py \
            chunk_splitor.py \
            stopwords_loader.py \
            selector_config.py \
            embedding_client.py \
            chunk_clusterer.py \
            chunk_scorer.py \
            test_chunk_selector.py \
            test_stopwords_loader.py \
            test_embedding_client.py \
            test_chunk_clusterer.py \
            test_chunk_scorer.py

      - name: Unit tests
        run: python -m unittest -v
