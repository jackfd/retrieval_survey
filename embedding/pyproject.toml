[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-embedding"
version = "0.1.2"
description = "Index input pipeline for embedding artifacts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT" 
authors = [
  { name = "jack", email = "jack@example.com" }
]
dependencies = [
  "blingfire>=0.1.8",
  "numpy>=1.23",
  "requests>=2.31",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "pyarrow>=10.0",
]

[project.optional-dependencies]
st = [
  "sentence-transformers==3.4.1",
  "transformers==4.48.2",
]
flag = [
  "FlagEmbedding==1.3.5",
  "transformers==4.44.2",
  "sentence-transformers<4",
]



[project.scripts]
retrieval-embedding= "embedding.main:cli"

[tool.setuptools]
packages = [
  "embedding",
  "embedding.domain",
  "embedding.infra",
  "embedding.infra.embedding_strategies",
  "embedding.services",
]

[tool.setuptools.package-dir]
embedding = "."

[tool.setuptools.package-data]
embedding = [
  "model_config.yaml",
]
